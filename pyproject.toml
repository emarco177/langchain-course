[project]
name = "evaluating-jev"
version = "0.1.0"
description = "Evaluating Jev — can its confidence be trusted to let the AutoMode gate act alone?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.15",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-typesafe[experimental]==0.0.1a3",
    "langsmith",
    "matplotlib>=3.9",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest>=8.0",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
