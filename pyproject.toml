[project]
name = "system-one-models"
version = "0.1.0"
description = "System One models — Jev and the LangChain TypeSafe integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.0.0",
    "langchain-typesafe[experimental]==0.0.1a3",
    "langsmith",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
